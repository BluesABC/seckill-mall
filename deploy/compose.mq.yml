name: seckill-mall-mq
services:
  prepare-volumes:
    image: apache/rocketmq:5.3.2
    user: '0:0'
    entrypoint: [sh, -c]
    command: ['mkdir -p /home/rocketmq/store /home/rocketmq/logs/rocketmqlogs /tmp/namesrv-logs/rocketmqlogs && chown -R 3000:3000 /home/rocketmq/store /home/rocketmq/logs /tmp/namesrv-logs']
    volumes:
      - broker-store:/home/rocketmq/store
      - broker-logs:/home/rocketmq/logs
      - namesrv-logs:/tmp/namesrv-logs
  namesrv:
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: '-Xms128m -Xmx128m -Xmn64m'
    ports: ['127.0.0.1:9876:9876']
    depends_on:
      prepare-volumes:
        condition: service_completed_successfully
    volumes: [namesrv-logs:/home/rocketmq/logs]
    healthcheck:
      test: [CMD-SHELL, "timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 3s
      retries: 20
  broker:
    image: apache/rocketmq:5.3.2
    command: sh mqbroker --enable-proxy -c /home/rocketmq/broker.conf
    environment:
      NAMESRV_ADDR: namesrv:9876
      JAVA_OPT_EXT: '-Xms512m -Xmx512m -Xmn128m'
    depends_on:
      namesrv:
        condition: service_healthy
    ports:
      - '127.0.0.1:10909:10909'
      - '127.0.0.1:10911:10911'
      - '127.0.0.1:10912:10912'
      - '127.0.0.1:8081:8081'
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - ./rocketmq/rmq-proxy.json:/home/rocketmq/rocketmq-5.3.2/conf/rmq-proxy.json:ro
      - broker-store:/home/rocketmq/store
      - broker-logs:/home/rocketmq/logs
    healthcheck:
      test: [CMD-SHELL, "timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
volumes:
  namesrv-logs:
  broker-store:
  broker-logs:
