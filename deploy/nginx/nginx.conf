user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # Do not log query strings, bearer tokens, captcha answers or request bodies.
  log_format mall '$remote_addr $request_method $uri $status $request_time';
  access_log /var/log/nginx/access.log mall;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=40r/s;
  limit_req_status 429;
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream seckill_backend { zone seckill_backend 64k; server seckill:8083 resolve; keepalive 32; }
  upstream order_backend { zone order_backend 64k; server order:8082 resolve; keepalive 32; }
  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /health/live { access_log off; default_type application/json; return 200 '{"service":"gateway","status":"UP"}'; }
    location = /health/order { include /etc/nginx/proxy.conf; proxy_pass http://order_backend/health/ready; }
    location = /health/seckill { include /etc/nginx/proxy.conf; proxy_pass http://seckill_backend/health/ready; }
    location ^~ /api/seckill/ { limit_req zone=api_per_ip burst=80 nodelay; include /etc/nginx/proxy.conf; proxy_pass http://seckill_backend; }
    location /api/ { limit_req zone=api_per_ip burst=80 nodelay; include /etc/nginx/proxy.conf; proxy_pass http://order_backend; }
    location ~ ^/assets/.*\.(js|css)$ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/security.conf; }
    location /assets/ { try_files $uri =404; expires 1h; }
    location = /index.html { add_header Cache-Control "no-cache"; include /etc/nginx/security.conf; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
