spring.application.name=order-service
server.port=${ORDER_PORT:8082}
server.address=${ORDER_BIND:127.0.0.1}
server.forward-headers-strategy=${ORDER_FORWARD_HEADERS_STRATEGY:none}
server.tomcat.remoteip.remote-ip-header=X-Real-IP
server.tomcat.remoteip.internal-proxies=${ORDER_TRUSTED_PROXY_REGEX:}
spring.jackson.parser.strict-duplicate-detection=true
mall.business-enabled=${MALL_BUSINESS_ENABLED:false}
mall.db-url=jdbc:mysql://${MALL_DB_HOST:127.0.0.1}:${MALL_DB_PORT:13306}/${MALL_DB_NAME:seckill_mall}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
mall.db-user=${MALL_DB_USER:mall}
mall.db-password=${MALL_DB_PASSWORD:}
mall.redis-host=${MALL_REDIS_HOST:127.0.0.1}
mall.redis-port=${MALL_REDIS_PORT:16379}
mall.key-prefix=${MALL_KEY_PREFIX:seckill}
mall.mq-endpoint=${MALL_MQ_ENDPOINT:127.0.0.1:8081}
mall.mq-topic=${MALL_MQ_TOPIC:seckill_reserved_v1}
mall.mq-group=${MALL_MQ_GROUP:mall_order_v1}
mall.lua-directory=${MALL_LUA_DIRECTORY:src/seckill/lua}
mall.payment-ttl-ms=${ORDER_PAYMENT_TTL_MS:900000}
mall.recovery-age-ms=${ORDER_RECOVERY_AGE_MS:1800000}
mall.jobs-enabled=${ORDER_JOBS_ENABLED:true}
